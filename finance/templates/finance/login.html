{% extends "finance/base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center vh-100 px-3 py-4">

  <div class="card shadow p-3 p-sm-4 w-100" style="max-width: 400px;">

    <div class="text-center mb-4">
      <div class="bg-light d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="width: 64px; height: 64px;">
        <i class="fa-solid fa-wallet fa-2x text-info"></i>
      </div>
      <h1 class="h3 fw-bold text-dark mb-1">KW Controle Financeiro</h1>
      <p class="text-muted small mb-0">Acesse sua conta para gerenciar suas finanças</p>
      <hr class="my-3" />
    </div>

    <h3 class="text-center mb-4">🔐 Login</h3>

    <form method="post" autocomplete="off">
      {% csrf_token %}

      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        <input type="text" name="username" autofocus required class="form-control" id="id_username" autocomplete="off" required>
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        <input type="password" name="password" required class="form-control" id="id_password" autocomplete="off" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Entrar</button>

       <p class="mt-3 text-center">
        Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>

    </form>
    

    {% if form.errors %}
      <div class="alert alert-danger mt-3">Usuário ou senha inválidos.</div>
    {% endif %}
  </div>
</div>
{% endblock %}
